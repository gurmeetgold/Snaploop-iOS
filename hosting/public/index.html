<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#FF0070" />
  <title>Join an Event in SnapLoop</title>
  <style>
    :root {
      color-scheme: light;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
      --ink:#0C0D1A;
      --muted:#68697A;
      --orange:#FF6E24;
      --coral:#FF304A;
      --pink:#FF0070;
      --magenta:#E800B8;
      --violet:#7D14FF;
      --blue:#453BFF;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
      background:
        radial-gradient(circle at 10% 90%,rgba(255,0,112,.09),transparent 34%),
        radial-gradient(circle at 88% 8%,rgba(125,20,255,.08),transparent 34%),
        linear-gradient(145deg,#FFFFFF 0%,#FFF7FB 44%,#FAF5FF 72%,#FFFFFF 100%);
      color:var(--ink);
    }
    main {
      width:min(440px,100%); background:rgba(255,255,255,.94); border-radius:32px;
      padding:32px 26px; box-shadow:0 24px 70px rgba(64,20,95,.12); text-align:center;
      border:1px solid rgba(255,0,112,.09); backdrop-filter:blur(18px);
    }
    .mark {
      display:block; width:86px; height:86px; margin:0 auto 14px; border-radius:20px;
      object-fit:cover; box-shadow:0 12px 28px rgba(255,0,112,.20);
    }
    .brand {
      display:inline-block; margin-bottom:22px; font-size:24px; font-weight:850;
      background:linear-gradient(90deg,var(--coral),var(--pink),var(--violet),var(--blue));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .eyebrow { font-size:14px; font-weight:750; color:var(--muted); margin-bottom:8px; }
    h1 { margin:0 0 12px; font-size:34px; line-height:1.08; letter-spacing:-.8px; }
    p { line-height:1.48; color:var(--muted); margin:8px 0; }
    #conversation { font-size:17px; margin:14px 0 8px; }
    #privacy { font-size:14px; margin-top:14px; }
    a.button {
      display:block; text-decoration:none; padding:17px 18px; border-radius:19px;
      font-weight:850; margin-top:24px;
      background:linear-gradient(110deg,var(--orange),var(--coral),var(--pink),var(--magenta),var(--violet),var(--blue));
      color:#fff; box-shadow:0 12px 28px rgba(255,0,112,.20);
    }
    #error {
      color:#B42318; background:#FFF3F2; border-radius:14px; padding:11px 12px;
      font-size:14px; margin-top:14px; display:none;
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/SnapLoopBrandMark.png" alt="" aria-hidden="true" />
    <div class="brand">SnapLoop</div>
    <div class="eyebrow">You've been invited to an Event</div>
    <h1 id="eventName">Join this Event</h1>
    <p id="conversation">Opening your invitation…</p>
    <p id="privacy">Join this Event to get your photos found on other participating members’ phones.</p>
    <a id="join" class="button" href="#">Join Event</a>
    <p id="error">We couldn't load the Event details. You can still open this invitation in SnapLoop.</p>
  </main>
<script>
(() => {
  const match = window.location.pathname.match(/^\/(e|c)\/([^/]+)/);
  const join = document.getElementById("join");
  const eventName = document.getElementById("eventName");
  const conversation = document.getElementById("conversation");
  const error = document.getElementById("error");

  if (!match) {
    join.style.display = "none";
    conversation.textContent = "Open a valid SnapLoop Event invitation to continue.";
    return;
  }

  const kind = match[1];
  const rawValue = match[2];
  const value = encodeURIComponent(rawValue);
  const baseURL = kind === "e"
    ? `snaploop://e/${value}`
    : `snaploop://c/${value}`;
  const acceptURL = `${baseURL}?action=accept`;

  const formatDate = (millis, timeZone) => {
    if (!millis) return null;
    const options = { month:"short", day:"numeric", year:"numeric" };
    if (timeZone) options.timeZone = timeZone;
    try {
      return new Intl.DateTimeFormat(undefined, options).format(new Date(millis));
    } catch (_) {
      // Legacy/corrupt timezone metadata must never make the invite unusable.
      return new Intl.DateTimeFormat(undefined, { month:"short", day:"numeric", year:"numeric" }).format(new Date(millis));
    }
  };

  fetch(`/api/invite-preview?kind=${encodeURIComponent(kind)}&value=${value}`, { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error(`preview unavailable (${response.status})`);
      return response.json();
    })
    .then((data) => {
      const name = data.name || "this Event";
      eventName.textContent = `Join “${name}”`;
      document.title = `Join ${name} in SnapLoop`;
      const canonicalTimeZone = Number(data.photoWindowVersion) === 1
        ? data.photoWindowTimeZoneId
        : null;
      const start = formatDate(data.startsAtMillis, canonicalTimeZone);
      const end = formatDate(data.endsAtMillis, canonicalTimeZone);
      const dates = start && end ? `, ${start} – ${end}` : "";
      const inviter = data.inviterName || "A SnapLoop member";
      conversation.textContent = `${inviter} invited you to ${name}${dates}.`;
    })
    .catch(() => {
      conversation.textContent = "You've been invited to join an Event in SnapLoop.";
      error.style.display = "block";
    });

  const openSnapLoop = (url, control, idleText) => {
    control.textContent = "Opening SnapLoop…";

    // Attempt the installed-app deep link without adding explanatory install/app
    // copy to the invitation page. If the custom scheme is unavailable Safari
    // simply stays on this page and the control returns to its idle label.
    const frame = document.createElement("iframe");
    frame.style.display = "none";
    frame.src = url;
    document.body.appendChild(frame);

    setTimeout(() => {
      frame.remove();
      control.textContent = idleText;
    }, 1400);
  };

  join.addEventListener("click", (event) => {
    event.preventDefault();
    openSnapLoop(acceptURL, join, "Join Event");
  });
})();
</script>
</body>
</html>
