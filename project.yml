name: SnapLoop

options:
  bundleIdPrefix: com.snaploop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "10.0.0"

targets:

  SnapLoop:
    type: application
    platform: iOS

    info:
      path: Sources/App/Info.plist
      properties:

        # Required by Firebase Phone Auth for reCAPTCHA fallback.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-254317517474-ios-fe19926e3a17d2661f95fb

    sources:
      - path: Sources

    dependencies:
      # Only attach FirebaseAuth explicitly.
      # FirebaseCore is brought in transitively by FirebaseAuth.
      - package: Firebase
        product: FirebaseAuth

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaploop.app

        GENERATE_INFOPLIST_FILE: YES

        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SnapLoop
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "SnapLoop looks through your photos to find pictures of you from your events. Your photos never leave your phone unless you're in them."

        INFOPLIST_KEY_NSCameraUsageDescription: "SnapLoop uses the camera to set up your face and to scan event QR codes."

    # GoogleService-Info.plist is developer-specific and gitignored.
    # After running xcodegen generate, verify it is still included in
    # the SnapLoop target.


  SnapLoopTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: Tests/SnapLoopTests

    dependencies:
      - target: SnapLoop

      # Match the application target.
      - package: Firebase
        product: FirebaseAuth

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaploop.app.tests


schemes:
  SnapLoop:

    build:
      targets:
        SnapLoop: all
        SnapLoopTests: [test]

    test:
      targets:
        - SnapLoopTests
