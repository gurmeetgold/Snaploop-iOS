name: SnapLoop

options:
  bundleIdPrefix: com.snaploop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.17.0"

targets:
  SnapLoop:
    type: application
    platform: iOS

    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-254317517474-ios-fe19926e3a17d2661f95fb
          - CFBundleURLName: MyPicsTube Invite
            CFBundleURLSchemes:
              - snaploop
        UIBackgroundModes:
          - remote-notification

    sources:
      - path: Sources

    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseRemoteConfig

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurmeetchhiber.snaploop.app
        PRODUCT_NAME: MyPicsTube
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyPicsTube
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "MyPicsTube looks through photos on this iPhone from your events to find confident matches. Matching happens on-device; only matched optimized previews are shared with event members."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "MyPicsTube saves a shared photo preview to your Photos library only when you tap Save."
        INFOPLIST_KEY_NSCameraUsageDescription: "MyPicsTube uses the front camera for guided Face Setup and can use the camera for event QR codes."
        INFOPLIST_KEY_NSContactsUsageDescription: "MyPicsTube lets an organizer choose a contact to send that person an event invitation. MyPicsTube does not upload your address book."

  SnapLoopTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: Tests/SnapLoopTests

    dependencies:
      - target: SnapLoop
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseRemoteConfig

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaploop.app.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  SnapLoop:
    build:
      targets:
        SnapLoop: all
        SnapLoopTests: [test]
    test:
      targets:
        - SnapLoopTests
