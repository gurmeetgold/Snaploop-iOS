name: SnapLoop

options:
  bundleIdPrefix: com.snaploop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_LANGUAGE: en

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: "12.17.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: "3.69.8"

targets:
  SnapLoop:
    type: application
    platform: iOS

    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: SnapLoop
        CFBundleName: SnapLoop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        SnapLoopPostHogProjectToken: "$(POSTHOG_PROJECT_TOKEN)"
        SnapLoopPostHogHost: "$(POSTHOG_HOST)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-254317517474-ios-c62155e2316187ee1f95fb
              - app-1-486574969744-ios-cee6aae8882dd483dc9915
          - CFBundleURLName: SnapLoop Invite
            CFBundleURLSchemes:
              - snaploop
        BGTaskSchedulerPermittedIdentifiers:
          - com.gurmeetchhiber.snaploop.app.event-photo-sync
        UIBackgroundModes:
          - fetch
          - remote-notification
          - processing

    sources:
      - path: Sources
        excludes:
          - App/GoogleService-Info.plist
          - App/GoogleService-Info-Dev.plist
          - App/GoogleService-Info-Prod.plist

    postBuildScripts:
      - name: Select Firebase configuration
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "$CONFIGURATION" = "Release" ]; then
            SOURCE_PLIST="${SRCROOT}/Sources/App/GoogleService-Info-Prod.plist"
          else
            SOURCE_PLIST="${SRCROOT}/Sources/App/GoogleService-Info-Dev.plist"
          fi

          if [ ! -f "$SOURCE_PLIST" ]; then
            echo "error: Missing Firebase configuration: $SOURCE_PLIST"
            exit 1
          fi

          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          mkdir -p "$(dirname "$DESTINATION")"
          cp "$SOURCE_PLIST" "$DESTINATION"

      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"

    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebasePerformance
      - package: PostHog
        product: PostHog

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurmeetchhiber.snaploop.app
        PRODUCT_NAME: SnapLoop
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/App/SnapLoop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SnapLoop
        INFOPLIST_KEY_CFBundleName: SnapLoop
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "SnapLoop checks photos on this iPhone that fall within your Event's selected date range to find confident matches. Matching happens on-device; only matched optimized previews are shared with Event members."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "SnapLoop saves a shared photo preview to your Photos library only when you tap Save."
        INFOPLIST_KEY_NSCameraUsageDescription: "SnapLoop uses the front camera for guided Face Setup and can use the camera for Event QR codes."
        INFOPLIST_KEY_NSContactsUsageDescription: "SnapLoop lets an Event organizer choose a contact to invite. SnapLoop does not upload your address book."
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        POSTHOG_HOST: https://us.i.posthog.com
      configs:
        Debug:
          APS_ENVIRONMENT: development
          SNAPLOOP_ASSOCIATED_DOMAIN: snaploop-dev.web.app
          POSTHOG_PROJECT_TOKEN: ""
        Release:
          APS_ENVIRONMENT: production
          SNAPLOOP_ASSOCIATED_DOMAIN: getsnaploop.web.app
          POSTHOG_PROJECT_TOKEN: "phc_AnftHggFKsEksu6ANLGbUsbMs32bU2u5JCpJaxo3wenY"

  SnapLoopTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: Tests/SnapLoopTests

    dependencies:
      - target: SnapLoop
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAnalytics

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaploop.app.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  SnapLoop:
    build:
      targets:
        SnapLoop: all
        SnapLoopTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - SnapLoopTests
    archive:
      config: Release

  SnapLoopCoverage:
    build:
      targets:
        SnapLoop: all
        SnapLoopTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - SnapLoop
      targets:
        - SnapLoopTests
