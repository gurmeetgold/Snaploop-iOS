name: SnapLoop

options:
  bundleIdPrefix: com.snaploop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.17.0"

targets:
  SnapLoop:
    type: application
    platform: iOS

    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-254317517474-ios-fe19926e3a17d2661f95fb
          - CFBundleURLName: SnapLoop Invite
            CFBundleURLSchemes:
              - snaploop
        UIBackgroundModes:
          - remote-notification

    sources:
      - path: Sources

    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseRemoteConfig

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurmeetchhiber.snaploop.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SnapLoop
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "SnapLoop looks through your photos to find pictures of you from your trips. Matching happens on your device; only matched thumbnails are shared with trip members."
        INFOPLIST_KEY_NSCameraUsageDescription: "SnapLoop uses the front camera to set up your face and can use the camera to scan trip QR codes."
        INFOPLIST_KEY_NSContactsUsageDescription: "SnapLoop lets an organizer choose a contact to send that person a trip invitation. SnapLoop does not upload your address book."

  SnapLoopTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: Tests/SnapLoopTests

    dependencies:
      - target: SnapLoop
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseRemoteConfig

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaploop.app.tests

schemes:
  SnapLoop:
    build:
      targets:
        SnapLoop: all
        SnapLoopTests: [test]
    test:
      targets:
        - SnapLoopTests
