name: One-shot compact event grid parity

on:
  push:
    branches:
      - 'fix/parity-date-grid-2026-09-11'
    paths:
      - '.github/workflows/one-shot-compact-event-grid-parity.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply parity batch
        run: python3 scripts/compact_event_grid_parity.py
      - name: Verify diff
        run: git diff --check
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install and verify evaluation face model
        run: |
          chmod +x scripts/install_face_model_v5.sh scripts/verify_face_model_v5.sh
          ./scripts/install_face_model_v5.sh
          ./scripts/verify_face_model_v5.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: xcodebuild -resolvePackageDependencies -project SnapLoop.xcodeproj -scheme SnapLoop
      - name: Build
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: xcodebuild -project SnapLoop.xcodeproj -scheme SnapLoop -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone") and x.get("isAvailable", False)))')"
          xcodebuild -project SnapLoop.xcodeproj -scheme SnapLoop -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
      - name: Archive Release without signing
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: xcodebuild -project SnapLoop.xcodeproj -scheme SnapLoop -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SnapLoop.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Commit verified implementation
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add Sources Tests
          git diff --cached --check
          git commit -m "Use compact Event dates and three-column photo grids"
          git push origin HEAD:fix/parity-date-grid-2026-09-11
