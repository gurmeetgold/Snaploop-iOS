name: MyPicsTube iOS Verify

on:
  push:
    branches:
      - chatgpt/mvp-stabilization-2
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install evaluation face model
        run: |
          chmod +x scripts/install_face_model_v5.sh
          ./scripts/install_face_model_v5.sh

      - name: Generate MyPicsTube icons
        run: /usr/bin/xcrun swift scripts/generate_mypicstube_icons.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project SnapLoop.xcodeproj \
            -scheme SnapLoop

      - name: Build MyPicsTube
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project SnapLoop.xcodeproj \
            -scheme SnapLoop \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
