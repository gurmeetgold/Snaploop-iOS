name: MyPicsRoom iOS Verify

on:
  push:
    branches:
      - chatgpt/mvp-stabilization-2
      - chatgpt/principal-release-hardening
    paths:
      - 'functions/**'
      - 'tests/backend/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  group: snaploop-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Check callable JavaScript syntax
        run: |
          set -euo pipefail
          for file in functions/*.js; do
            node --check "$file"
          done

      - name: Verify Event calendar-day semantics
        run: node --test tests/backend/event-date-semantics.test.mjs

      - name: Verify client to callable contract
        run: node --test tests/backend/callable-contract.test.mjs

      - name: Verify Change 4 incremental match invariants
        run: node --test tests/backend/change4-match-metadata.test.mjs

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase emulator test tools
        run: |
          npm install --global firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase

      - name: Run backend authorization and callable integration tests
        run: |
          firebase emulators:exec \
            --project demo-mypicsroom-security \
            --only auth,firestore,storage,functions \
            "node --test tests/backend/security-rules.test.mjs && node --test tests/backend/functions-integration.test.mjs && node --test tests/backend/change4-publishing-integration.test.mjs && node --test tests/backend/membership-identity.test.mjs && node --test tests/backend/event-date-edit-compatibility.test.mjs"

  build-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against automatic app icon generation
        run: |
          set -euo pipefail
          if grep -nE 'preBuildScripts|Generate MyPicsRoom App Icons|generate_mypicstube_icons\.swift' project.yml; then
            echo '::error::project.yml must not generate app icons during every Xcode build. Keep the committed static AppIcon assets instead.'
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install and verify evaluation face model
        run: |
          chmod +x scripts/install_face_model_v5.sh scripts/verify_face_model_v5.sh
          ./scripts/install_face_model_v5.sh
          ./scripts/verify_face_model_v5.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project SnapLoop.xcodeproj \
            -scheme SnapLoop

      - name: Build MyPicsRoom
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project SnapLoop.xcodeproj \
            -scheme SnapLoop \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          set -o pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone") and x.get("isAvailable", False)))')"
          xcodebuild \
            -project SnapLoop.xcodeproj \
            -scheme SnapLoop \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Archive Release configuration without signing
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project SnapLoop.xcodeproj \
            -scheme SnapLoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SnapLoop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
